name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: Backend build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - exp1
          - exp2/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven
        run: mvn -B clean package -f ${{ matrix.module }}/pom.xml

      - name: Run tests
        run: mvn -B test -f ${{ matrix.module }}/pom.xml

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: exp2/frontend

      - name: Build
        run: npm run build
        working-directory: exp2/frontend
